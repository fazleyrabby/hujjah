# Rust optimization settings for smaller builds
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 4
strip = true

[profile.dev.build-override]
opt-level = 0
debug = false

[profile.release.build-override]
opt-level = 0
debug = false
